<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="../theme.css?v=3">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cast three cards · The Recursive Tarot</title>
<meta name="description" content="One spread, one deck, one button: cast three Book T cards, then talk about them.">
<link rel="icon" type="image/svg+xml" href="../public/favicon.svg?v=2">
<link rel="stylesheet" href="../style.css?v=5">
<link rel="canonical" href="https://tarot.recursive.eco/pages/read.html">
<style>
  main.wrap{max-width:980px;padding:0 16px 40px}
  .intro{text-align:center;padding:28px 0 6px}
  .intro h1{font-family:var(--serif-display);font-weight:600;font-size:clamp(30px,6vw,44px);line-height:1.08;margin:0;color:var(--ink)}
  .intro .sub{font-family:var(--sans);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#8a6414;margin:0 0 10px}
  .creed{font-family:var(--serif-body);font-style:italic;font-size:clamp(16px,2.4vw,18px);line-height:1.6;color:var(--ink-soft);margin:16px auto 0;max-width:60ch}
  .ask{max-width:560px;margin:22px auto 0;display:flex;flex-direction:column;gap:12px;align-items:stretch}
  .ask label{font-family:var(--sans);font-size:13px;color:var(--mut)}
  .ask textarea{width:100%;box-sizing:border-box;min-height:64px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:16px/1.5 var(--serif-body);resize:vertical}
  .btn{min-height:48px;padding:0 24px;border-radius:999px;border:1px solid var(--gold);background:var(--gold);color:#fff;font:600 16px var(--sans);cursor:pointer}
  .btn:hover{filter:brightness(1.07)}
  .btn.quiet{background:transparent;color:var(--ink-soft);border-color:var(--line);font-weight:500;font-size:14px}
  .btn.quiet:hover{border-color:var(--gold);color:var(--ink)}
  .btn:focus-visible,.card-btn:focus-visible,.ask textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  #reading[hidden]{display:none}
  .row{display:grid;grid-template-columns:1fr;gap:28px;margin:30px auto 0;justify-items:center}
  .slot{width:100%;max-width:300px;min-width:0;text-align:center}
  .pos{font-family:var(--sans);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#8a6414;margin:0 0 4px}
  .posmean{font-family:var(--serif-body);font-size:13.5px;line-height:1.45;color:var(--mut);margin:0 0 10px;min-height:0}
  .card-btn{display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:8px;background:var(--thumb-bg);cursor:pointer;box-shadow:var(--shadow-card)}
  .card-btn img{display:block;width:100%;height:auto;aspect-ratio:560/1030;object-fit:contain;border-radius:8px}
  .cname{font-family:var(--serif-display);font-weight:600;font-size:20px;color:var(--ink);margin:12px 0 2px}
  .cprint{font-family:var(--sans);font-size:12px;color:var(--mut);margin:0}
  .tap{font-family:var(--sans);font-size:12px;color:var(--gold);margin:6px 0 0;min-height:44px;line-height:44px;background:none;border:0;cursor:pointer;width:100%}
  .text{text-align:left;font-family:var(--serif-body);font-size:15.5px;line-height:1.65;color:var(--ink-soft);background:var(--surface);border:1px solid var(--line-soft);border-radius:8px;padding:14px 16px;margin-top:6px}
  .text[hidden]{display:none}
  .text p{margin:0 0 .8em}.text p:last-child{margin:0}
  .text a{color:var(--gold)}
  .actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;margin:30px 0 0}
  #castCount{font-family:var(--sans);font-size:12px;color:var(--mut)}
  .more{margin:34px 0 0}
  .chip{min-height:44px;margin:0 4px 6px;padding:0 14px;border-radius:999px;border:1px solid var(--chipline);background:var(--chip);color:var(--ink-soft);font:500 12px var(--sans);letter-spacing:.06em;text-transform:none;cursor:pointer;max-width:100%}
  .chip:hover{border-color:var(--gold);color:var(--ink)}
  .chip:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .chip::after{content:" \25BE";color:var(--gold)}
  .pick{display:flex;flex-direction:column;gap:6px}
  .pick-item{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);text-align:left;cursor:pointer;font-family:var(--sans)}
  .pick-item:hover,.pick-item.on{border-color:var(--gold);background:var(--chip)}
  .pick-item:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .pick-name{font-size:15px;font-weight:600}.pick-sub{font-size:12.5px;color:var(--mut)}
  .row.many{grid-template-columns:repeat(2,1fr);gap:20px}.row.c1{max-width:300px}
  .note{text-align:center;font-family:var(--sans);font-size:13px;color:var(--mut);margin:12px 0 0}
  @media (min-width:760px){ .row{align-items:start;gap:26px} .row.c2{grid-template-columns:repeat(2,1fr)} .row.c3{grid-template-columns:repeat(3,1fr)} .row.c4,.row.many{grid-template-columns:repeat(4,1fr)} .row.c1{grid-template-columns:1fr} .slot{max-width:none} }
</style>
</head>
<body data-assistant-context="tarot">
<script src="../site-header.js?v=52"></script>
<site-header active=""></site-header>

<main class="wrap">
  <section class="intro">
    <p class="sub"><button type="button" class="chip" id="chipSpread" aria-haspopup="dialog" title="Choose a spread">Structures · Process · Possibilities</button><button type="button" class="chip" id="chipDeck" aria-haspopup="dialog" title="Choose a deck">Book T (Golden Dawn)</button></p>
    <h1 id="h1">Cast three cards</h1>
    <p class="creed" id="creed"></p>
    <div class="ask">
      <label for="q">A question, if you have one (optional)</label>
      <textarea id="q" maxlength="400" placeholder="What are you sitting with?"></textarea>
      <button class="btn" id="cast" type="button">Cast the cards</button>
    </div>
  </section>

  <section id="reading" hidden aria-live="polite">
    <div class="row" id="row"></div>
    <div class="actions">
      <button class="btn" id="talk" type="button">Talk about it</button>
      <button class="btn quiet" id="again" type="button">Cast again</button>
      <span id="castCount"></span>
    </div>
    <p class="note" id="note" role="status"></p>
  </section>

  <div class="more" id="actions2"></div>
</main>

<script src="../viewers/reference-resolve.js"></script>
<script src="../viewers/dialog.js"></script>
<script src="../viewers/card-detail.js"></script>
<script src="../viewers/reading-actions.js"></script>
<script src="read.js?v=2"></script>
<script src="../assistant.js" defer></script>
<script src="../site-footer.js?v=1"></script>
<site-footer base="../"></site-footer>
</body>
</html>
