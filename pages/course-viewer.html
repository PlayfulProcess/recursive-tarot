<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course moved — Recursive Tarot</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../theme.css?v=3">
<style>body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif}main{max-width:560px;margin:15vh auto;padding:0 22px}a{color:var(--gold)}</style>
<script src="../courses-play.js"></script>
<script>
// The course viewer retired on Oct 23 2026: every course is a grammar read in recursive.eco Play
// (Continuous). This page keeps the old addresses alive:
//   ?course=<id>             -> that course in Play (the map is courses-play.js)
//   ?course=booklets/<id>    -> the booklet, rendered by course.html
//   ?course=../research/<f>  -> the research chapter, rendered by course.html
//   ?grammar_id=<uuid>       -> that grammar in Play
// Anything else (a course still Private, a typo) lands on the course list.
(function () {
  var p = new URLSearchParams(location.search);
  var c = (p.get('course') || p.get('item') || '').trim();
  var g = p.get('grammar_id');
  var to = 'courses.html';
  if (g && /^[0-9a-f-]{36}$/i.test(g)) to = 'https://recursive.eco/play?id=' + g + '&pane=continuous';
  else if (/^booklets\/[a-z0-9-]+$/.test(c)) to = 'course.html?src=' + encodeURIComponent('../course/' + c + '.mdx');
  else if (/^\.\.\/research\/[a-z0-9\/._-]+$/i.test(c) && c.indexOf('..', 2) < 0) to = 'course.html?src=' + encodeURIComponent(c + (/\.mdx?$/.test(c) ? '' : '.mdx'));
  else if (c && window.coursePlayUrl && window.coursePlayUrl(c)) to = window.coursePlayUrl(c);
  location.replace(to);
})();
</script>
</head>
<body><main><p>The courses now open in recursive.eco. If nothing happens, see <a href="courses.html">all courses</a>.</p></main></body>
</html>
