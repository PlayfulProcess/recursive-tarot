<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="../theme.css?v=3">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All Courses · The Recursive Tarot</title>
<meta name="description" content="Every course in the Recursive Tarot — the history, how the cards can work, the honest questions, the Golden Dawn, and how to contribute — each with a cover from the library.">
<link rel="icon" type="image/svg+xml" href="../public/favicon.svg?v=2">
<link rel="stylesheet" href="../style.css?v=5">
<style>
  /* All-courses gallery. Data: course/_courses.json (the catalog, grouped the same
     way the header's Courses dropdown groups its own shorter list) + tarot/_collection.json
     (deck covers, so a course thumbnail follows its deck's art). Thumbnails are letterboxed,
     never cropped — the whole card shows (house rule). Colour: theme.css tokens only. */
  main.wrap{max-width:1120px}

  /* ── hero, matching the homepage's editorial register ── */
  .chero{text-align:center;max-width:640px;margin:26px auto 0;padding:0 18px}
  .chero .eyebrow{font-family:var(--sans);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
    color:#8a6414;margin:0 0 10px}
  .chero h1{font-family:var(--serif-display);font-weight:600;font-size:clamp(32px,6vw,50px);
    line-height:1.05;letter-spacing:.3px;margin:0;color:var(--ink)}
  .chero h1 .gold{color:var(--gold)}
  /* named .tagline, not .tag — style.css's global .tag is a small pill-shaped label
     class (genre chips) and would otherwise leak its border/border-radius/padding in here */
  .chero .tagline{display:block;font-family:var(--serif-body);font-style:italic;color:var(--ink-soft);
    font-size:clamp(15.5px,2vw,18px);line-height:1.55;margin:14px auto 0;max-width:52ch}

  main.wrap > #root{max-width:1120px;margin:0 auto;padding:0 18px 64px}

  /* ── group sections, labelled the way the homepage labels its galleries ── */
  .group{margin:46px 0 0}
  .group:first-child{margin-top:40px}
  .glabel{display:flex;align-items:baseline;gap:12px;margin:0 0 16px}
  .glabel h2{font-family:var(--serif-display);font-weight:600;font-size:clamp(19px,3vw,23px);
    margin:0;color:var(--ink);white-space:nowrap}
  .glabel::after{content:'';flex:1;height:1px;background:var(--line);align-self:center}

  /* ── course cards: same hover-lift + contained-art idiom as the homepage's tiles ── */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
  .ccard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line-soft);
    border-radius:12px;overflow:hidden;text-decoration:none;color:var(--ink);
    transition:transform .15s,box-shadow .15s,border-color .15s}
  .ccard:hover{transform:translateY(-4px);box-shadow:var(--shadow-lift);border-color:var(--gold)}
  .ccard .cover{aspect-ratio:4/3;background:var(--thumb-bg) center/contain no-repeat;
    border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center}
  .ccard .cover img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block}
  .ccard .cover .noimg{font-family:var(--serif-display);font-size:2rem;color:var(--mut)}
  .ccard .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
  .ccard .badge{align-self:flex-start;font-family:var(--sans);font-size:10px;font-weight:700;
    letter-spacing:.1em;text-transform:uppercase;color:#8a5fb0;background:rgba(122,95,176,.1);
    border:1px solid rgba(122,95,176,.35);border-radius:999px;padding:2px 9px;margin-bottom:2px}
  .ccard h3{margin:0;font-size:1.05rem;line-height:1.3;font-family:var(--serif-display);font-weight:600}
  .ccard .blurb{font-family:var(--serif-body);font-size:.87rem;color:var(--ink-soft);line-height:1.55}
  .ccard .go{margin-top:auto;padding-top:6px;font-family:var(--sans);font-size:.82rem;font-weight:600;color:var(--gold)}
  .loading{text-align:center;color:var(--mut);padding:60px 0;font-style:italic;font-family:var(--serif-body)}
</style>
</head>
<body>
<script src="../site-header.js?v=47"></script>
<site-header active="course"></site-header>

<main class="wrap">
  <section class="chero">
    <p class="eyebrow">The Recursive Tarot</p>
    <h1>All <span class="gold">Courses</span></h1>
    <p class="tagline">Everything this library teaches — the history, the honest questions, the traditions,
      and how to join in. Read to know yourself, not to surrender yourself.</p>
  </section>
  <div id="root"><p class="loading">Loading the courses…</p></div>
</main>

<script>
(async function () {
  const root = document.getElementById('root');
  let cat, col;
  try {
    [cat, col] = await Promise.all([
      fetch('../course/_courses.json').then(r => r.json()),
      fetch('../tarot/_collection.json').then(r => r.json()).catch(() => ({ grammars: [] })),
    ]);
  } catch (e) {
    root.innerHTML = '<p class="loading">Could not load the course catalog.</p>';
    return;
  }
  const coverBySlug = Object.fromEntries((col.grammars || []).map(g => [g.slug, g.cover_image_url]));
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  root.innerHTML = (cat.groups || []).map(group => {
    const cards = (group.courses || []).map(c => {
      const img = c.thumb || coverBySlug[c.deck] || '';
      const cover = img
        ? `<img loading="lazy" src="${esc(img)}" alt="">`
        : '<span class="noimg">☙</span>';
      // A blurb prefixed "(Draft)" (the fallback flag for a course still being written —
      // course/_courses.json has no dedicated status field) renders as a small badge
      // instead of leaking the parenthetical into the sentence itself.
      const draftMatch = /^\(draft\)\s*/i.exec(c.blurb || '');
      const badge = draftMatch ? '<span class="badge">Draft</span>' : '';
      const blurb = draftMatch ? c.blurb.slice(draftMatch[0].length) : c.blurb;
      return `<a class="ccard" href="course-viewer.html?course=${esc(c.id)}">
        <div class="cover">${cover}</div>
        <div class="body">
          ${badge}
          <h3>${esc(c.title)}</h3>
          <p class="blurb">${esc(blurb)}</p>
          <span class="go">Read →</span>
        </div>
      </a>`;
    }).join('');
    return `<section class="group"><div class="glabel"><h2>${esc(group.name)}</h2></div><div class="cards">${cards}</div></section>`;
  }).join('');
})();
</script>

<script src="../site-footer.js?v=1"></script>
<site-footer base="../"></site-footer>
<script src="../assistant.js" defer></script>
</body>
</html>
