name: Rebuild meta-grammar

# Auto-rebuilds the aggregated meta-grammar whenever a deck changes and commits it back, so
# recursive.eco (which reads from main) always sees a fresh tarot/all-decks-many-lenses/grammar.json.
#
# main is the app-sync source but is NOT the live static site — GitHub Pages serves
# claude/website-content-cards-plan-xwn8lj (see CLAUDE.md "Two branches matter"). This workflow
# used to ALSO deploy Pages from main (same job name, same push cadence as the claude branch's
# copy of this file). Both wrote to the same `github-pages` environment, so whichever run finished
# last won the live site — and because main's viewers/ content is usually staler than the claude
# branch's, main's deploy would silently clobber the live site with old HTML/CSS/JS after almost
# every push here. Diagnosed Jul 27 2026 (icon toolbar + label-wrap fixes landed on the claude
# branch and built successfully, then vanished from tarot.recursive.eco minutes later — the actual
# GitHub Pages deployment history showed a main-branch deploy of an older commit landing right
# after). Fix: main only rebuilds + commits the meta-grammar now. Pages deploy lives solely on the
# claude/website-content-cards-plan-xwn8lj copy of this workflow — do not re-add `pages: write` /
# `deploy-pages` here without also removing it from wherever else currently deploys.

on:
  push:
    branches: [main]
    paths:
      - 'tarot/**'
      - 'scripts/build_meta_grammar.py'
  workflow_dispatch:

permissions:
  contents: write   # to commit the regenerated meta

jobs:
  rebuild-meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild meta-grammar
        run: python scripts/build_meta_grammar.py

      - name: Commit regenerated meta (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- tarot/all-decks-many-lenses/grammar.json; then
            git add tarot/all-decks-many-lenses/grammar.json
            git commit -m "chore: rebuild meta-grammar [skip ci]"
            git push
          else
            echo "meta unchanged"
          fi
