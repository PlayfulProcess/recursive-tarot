<g id="part" data-color="#3f8a3a">
  <g fill="none" stroke-linecap="round">
    <path d="M0 0 C95 -10 100 -178 0 -170 C-100 -178 -95 -10 0 0 C95 10 100 178 0 170 C-100 178 -95 10 0 0" stroke="#1f4a1c" stroke-width="16"/>
    <path d="M0 0 C95 -10 100 -178 0 -170 C-100 -178 -95 -10 0 0 C95 10 100 178 0 170 C-100 178 -95 10 0 0" stroke="currentColor" stroke-width="11"/>
    <path d="M0 0 C95 -10 100 -178 0 -170 C-100 -178 -95 -10 0 0 C95 10 100 178 0 170 C-100 178 -95 10 0 0" stroke="#e2bd4f" stroke-width="4" stroke-dasharray="10 12"/>
  </g>
  <g stroke="#1f4a1c" stroke-width="2.5">
    <path d="M-6 -170 C-4 -184 22 -186 30 -176 C34 -170 30 -162 20 -162 C10 -162 4 -164 -6 -170 Z" fill="currentColor"/>
    <circle cx="20" cy="-174" r="2.5" fill="#e2bd4f"/>
  </g>
</g>
</svg>
