<svg xmlns="http://www.w3.org/2000/svg" viewBox="-270 -50 540 210" width="540" height="210">
<title>cloud-bank: a bank of clouds across the foot of a picture</title>
<!-- Origin: the middle of the bank's upper edge; 520 wide, it fills 150 down. currentColor is the cloud
     (white, grey cumulus, grey nimbus, or dark driving stratus). -->
<g id="part" data-color="#eef1f6">
  <g fill="none" stroke="#7d8698" stroke-width="6">
    <circle cx="-230" cy="10" r="34"/><circle cx="-176" cy="-4" r="36"/><circle cx="-118" cy="8" r="32"/><circle cx="-62" cy="-6" r="38"/>
    <circle cx="0" cy="6" r="34"/><circle cx="58" cy="-8" r="38"/><circle cx="116" cy="6" r="32"/><circle cx="172" cy="-4" r="36"/><circle cx="228" cy="10" r="34"/>
    <rect x="-262" y="20" width="524" height="130"/>
  </g>
  <g fill="currentColor">
    <circle cx="-230" cy="10" r="34"/><circle cx="-176" cy="-4" r="36"/><circle cx="-118" cy="8" r="32"/><circle cx="-62" cy="-6" r="38"/>
    <circle cx="0" cy="6" r="34"/><circle cx="58" cy="-8" r="38"/><circle cx="116" cy="6" r="32"/><circle cx="172" cy="-4" r="36"/><circle cx="228" cy="10" r="34"/>
    <rect x="-262" y="20" width="524" height="130"/>
  </g>
</g>
</svg>
