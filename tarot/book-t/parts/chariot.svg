<svg xmlns="http://www.w3.org/2000/svg" viewBox="-70 -20 230 130" width="230" height="130">
<title>chariot: a chariot seen from the side, one wheel shewn, its pole running forward to the right</title>
<!-- Origin: the seat (figure-seated's origin goes here, drawn BEFORE the chariot so the car hides the lap).
     The wheel's hub is at (0,64); the pole's end, where the beast is yoked, at (150,34). currentColor is the car. -->
<g id="part" data-color="#c9a24a">
  <path d="M56 34 L150 30" stroke="#5a3a1c" stroke-width="7" stroke-linecap="round"/>
  <path d="M-62 -6 L62 -6 L68 50 L-58 50 Z" fill="currentColor" stroke="#5a3a1c" stroke-width="3" stroke-linejoin="round"/>
  <path d="M-58 4 L64 4 M-56 40 L66 40" stroke="#5a3a1c" stroke-width="2"/>
  <circle cx="0" cy="64" r="42" fill="#d8b46a" stroke="#5a3a1c" stroke-width="4"/>
  <circle cx="0" cy="64" r="32" fill="none" stroke="#5a3a1c" stroke-width="2"/>
  <g stroke="#5a3a1c" stroke-width="3"><path d="M0 22 V106 M-42 64 H42 M-30 34 L30 94 M30 34 L-30 94"/></g>
  <circle cx="0" cy="64" r="9" fill="currentColor" stroke="#5a3a1c" stroke-width="3"/>
</g>
</svg>
