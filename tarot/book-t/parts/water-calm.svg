<svg xmlns="http://www.w3.org/2000/svg" viewBox="-270 -10 540 170" width="540" height="170">
<title>water-calm: clear calm water, a lake or pool</title>
<!-- Origin: the middle of the water's surface; the water runs 260 to each side and 150 down. currentColor is the water. -->
<g id="part" data-color="#9cc3e3">
  <rect x="-260" y="0" width="520" height="150" fill="currentColor"/>
  <line x1="-260" y1="0" x2="260" y2="0" stroke="#3f7fbf" stroke-width="3"/>
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".9">
    <line x1="-220" y1="18" x2="-170" y2="18"/><line x1="-60" y1="22" x2="0" y2="22"/><line x1="120" y1="16" x2="180" y2="16"/>
    <line x1="-150" y1="44" x2="-90" y2="44"/><line x1="40" y1="48" x2="100" y2="48"/><line x1="190" y1="40" x2="240" y2="40"/>
    <line x1="-240" y1="72" x2="-190" y2="72"/><line x1="-40" y1="78" x2="20" y2="78"/><line x1="130" y1="84" x2="190" y2="84"/>
  </g>
</g>
</svg>
