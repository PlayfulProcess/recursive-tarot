<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -50 80 58" width="80" height="58">
<title>lotus: a lotus or water-lily flower</title>
<!-- Origin: where the stem meets the flower; the petals rise from it. Rotate to bend it over a cup.
     currentColor is the petals' tint. -->
<g id="part" data-color="#f3c6d6">
  <g stroke="#a8627e" stroke-width="2" stroke-linejoin="round">
    <path d="M0 0 C-22 -2 -34 -12 -36 -20 C-24 -18 -12 -12 0 0 Z" fill="currentColor"/>
    <path d="M0 0 C22 -2 34 -12 36 -20 C24 -18 12 -12 0 0 Z" fill="currentColor"/>
    <path d="M0 -2 C-18 -10 -24 -26 -20 -38 C-10 -28 -4 -16 0 -2 Z" fill="#fbeef3"/>
    <path d="M0 -2 C18 -10 24 -26 20 -38 C10 -28 4 -16 0 -2 Z" fill="#fbeef3"/>
    <path d="M0 -2 C-9 -14 -8 -32 0 -46 C8 -32 9 -14 0 -2 Z" fill="#ffffff"/>
    <path d="M-10 2 C-6 -2 6 -2 10 2 C6 6 -6 6 -10 2 Z" fill="#5e8a3a" stroke="#2f5a22"/>
  </g>
</g>
</svg>
