<title>club: the heavy club of the Ace of Wands, with three branches</title>
<!-- Book T: "a heavy club, which has three branches in the colours, and with the sigils, of the scales. The Right-and
     Left-hand branches end respectively in three Flames, and the Centre one in four Flames". Origin: where the hand
     grips it, low on the shaft. The branches' collars carry the colours of the scales (here red, blue and yellow) and
     a small sigil mark. The twenty-two Yods are placed by the card's spec. -->
