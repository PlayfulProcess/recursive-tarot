  <path d="M-260 10 C-180 -6 -100 -14 0 -16 C100 -14 180 -6 260 10 L260 150 L-260 150 Z" fill="currentColor" stroke="#5a4426" stroke-width="3" stroke-linejoin="round"/>
  <g stroke="#7a5e36" stroke-width="2.5" stroke-linecap="round" opacity=".8">
    <line x1="-200" y1="30" x2="-170" y2="30"/><line x1="-90" y1="40" x2="-50" y2="40"/><line x1="40" y1="28" x2="80" y2="28"/>
    <line x1="150" y1="44" x2="190" y2="44"/><line x1="-140" y1="70" x2="-100" y2="70"/><line x1="0" y1="76" x2="40" y2="76"/><line x1="120" y1="80" x2="160" y2="80"/>
  </g>
</g>
</svg>
