<svg xmlns="http://www.w3.org/2000/svg" viewBox="-130 -90 260 300" width="260" height="300">
<title>fountain: a fountain of clear and glistening water rising and falling in sprays on all sides</title>
<!-- Origin: the source of the jet. The sprays fall to y=+200. -->
<g id="part" data-color="#3f7fbf">
  <g fill="none" stroke-linecap="round">
    <g stroke="currentColor" stroke-width="9">
      <path d="M0 0 L0 -70"/>
      <path d="M0 -70 C-40 -90 -90 -40 -110 200"/><path d="M0 -70 C40 -90 90 -40 110 200"/>
      <path d="M0 -64 C-30 -70 -60 -20 -70 200"/><path d="M0 -64 C30 -70 60 -20 70 200"/>
      <path d="M0 -60 C-14 -50 -30 0 -32 200"/><path d="M0 -60 C14 -50 30 0 32 200"/>
    </g>
    <g stroke="#ffffff" stroke-width="4.5">
      <path d="M0 0 L0 -70"/>
      <path d="M0 -70 C-40 -90 -90 -40 -110 200"/><path d="M0 -70 C40 -90 90 -40 110 200"/>
      <path d="M0 -64 C-30 -70 -60 -20 -70 200"/><path d="M0 -64 C30 -70 60 -20 70 200"/>
      <path d="M0 -60 C-14 -50 -30 0 -32 200"/><path d="M0 -60 C14 -50 30 0 32 200"/>
    </g>
  </g>
  <g fill="#ffffff" stroke="currentColor" stroke-width="1.8">
    <circle cx="-120" cy="40" r="4"/><circle cx="120" cy="40" r="4"/><circle cx="-92" cy="-30" r="3.5"/><circle cx="92" cy="-30" r="3.5"/>
    <circle cx="-50" cy="-80" r="3.5"/><circle cx="50" cy="-80" r="3.5"/><circle cx="-124" cy="120" r="3.5"/><circle cx="124" cy="120" r="3.5"/>
    <circle cx="-86" cy="90" r="3"/><circle cx="86" cy="90" r="3"/><circle cx="0" cy="-86" r="3.5"/>
  </g>
</g>
</svg>
