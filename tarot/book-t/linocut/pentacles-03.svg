<title id="t">Lord of Material Works: Three of Pentacles · Mars in Capricorn · Binah (Book T deck, linocut)</title>
<desc id="d">A linocut printing of the full imagery. Book T (1912): &quot;A WHITE-WINGED Angelic Hand, as before, holding a branch of a rose tree, of which two white rosebuds touch and surmount the topmost Pentacle. The Pentacles are arranged in an equilateral triangle. Above and below the symbols Mars and Capricorn.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); printed by scripts/build_book_t_linocut.py.</desc>
