<title id="t">Daughter of the Flaming Sword: Fortitude · Teth · Leo (Book T deck, linocut)</title>
<desc id="d">A linocut printing of the full imagery. Book T gives the Keys their meanings only, no picture. Drawn from the Key&#x27;s title and the figure the tradition gives it, as a symbol (no faces): a woman who masters the lion, her hand upon its head; Leo. Book T (1912): &quot;Courage, strength, fortitude, power passing on to action. Obstinacy.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); printed by scripts/build_book_t_linocut.py.</desc>
