<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 960" width="560" height="960" role="img" aria-labelledby="t d">
<title id="t">Princess of the Echoing Hills: the Rose of the Palace of Earth: Knave of Pentacles · Earth of Earth (Book T deck, linocut)</title>
<desc id="d">A linocut printing of the full imagery. &#x27;Standing on grass or flowers&#x27;: drawn as land with flowers; her mantle of sheepskin in cream. Book T (1912): &quot;A STRONG and beautiful Amazon figure with rich brown hair, standing on grass or flowers. A grove of trees near her. Her form suggests Hebe, Ceres, and Proserpine. She bears a winged ram&#x27;s head as a crest: and wears a mantle of sheepskin. In one hand she carries a sceptre with a circular disk: in the other a Pentacle similar to that of the Ace of Pentacles.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); printed by scripts/build_book_t_linocut.py.</desc>
