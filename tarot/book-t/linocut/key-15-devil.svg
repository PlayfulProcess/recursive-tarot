<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 960" width="560" height="960" role="img" aria-labelledby="t d">
<title id="t">Lord of the Gates of Matter: the Child of the Forces of Time: The Devil · Ayin · Capricorn (Book T deck, linocut)</title>
<desc id="d">A linocut printing of the full imagery. Book T gives the Keys their meanings only, no picture. Drawn from the Key&#x27;s title and the figure the tradition gives it, as a symbol (no faces): a horned and winged figure standing on a cubical altar, an inverted torch in its hand, two small figures chained below; Capricorn. Book T (1912): &quot;Materiality, material force, material temptation, obsession.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); printed by scripts/build_book_t_linocut.py.</desc>
