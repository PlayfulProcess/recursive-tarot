<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 960" width="560" height="960" role="img" aria-labelledby="t d">
<title id="t">Lord of the Fire of the World: The Sun · Resh · Sun (Book T deck, linocut)</title>
<desc id="d">A linocut printing of the full imagery. Book T gives the Keys their meanings only, no picture. Drawn from the Key&#x27;s title and the figure the tradition gives it, as a symbol (no faces): the sun in his glory over two children before a wall; the Sun. Book T (1912): &quot;Glory, gain, riches. With &quot;very&quot; evil cards it means arrogance, display, vanity.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); printed by scripts/build_book_t_linocut.py.</desc>
