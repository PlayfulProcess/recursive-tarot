<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 960" width="560" height="960" role="img" aria-labelledby="t d">
<title id="t">Lord of Perfected Success: Ten of Cups · Mars in Pisces · Malkuth (Book T deck, linocut)</title>
<desc id="d">A linocut printing of the full imagery. Book T does not say where the top cup and its lotus stand or how the other nine are arranged: drawn as one cup above, held sideways, and nine in three rows; Mars is set at the upper left to leave the top for the lotus. Book T (1912): &quot;HAND, as usual, holding bunch of water-lilies or lotuses, whose flowers pour a white water into all the cups, which &quot;all run over.&quot; The uppermost cup is held sideways by a hand, and pours water into the left-hand upper cup. A single lotus flower surmounts the top cup, and is the source of the water that fills it. Above and below the symbols Mars and Pisces.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); printed by scripts/build_book_t_linocut.py.</desc>
