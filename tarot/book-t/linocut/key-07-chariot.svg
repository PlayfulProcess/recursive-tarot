<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 960" width="560" height="960" role="img" aria-labelledby="t d">
<title id="t">Child of the Powers of the Waters; the Lord of the Triumph of Light: The Chariot · Cheth · Cancer (Book T deck, linocut)</title>
<desc id="d">A linocut printing of the full imagery. Book T gives the Keys their meanings only, no picture. Drawn from the Key&#x27;s title and the figure the tradition gives it, as a symbol (no faces): a crowned and armoured figure in a chariot drawn by a black and a white horse, over the Waters; Cancer. Book T (1912): &quot;Triumph, victory, health (sometimes unstable).&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); printed by scripts/build_book_t_linocut.py.</desc>
