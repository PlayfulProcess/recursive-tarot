<title id="t">Daughter of the Reconcilers: the Bringer-Forth of life: Temperance · Samekh · Sagittarius (Book T deck, linocut)</title>
<desc id="d">A linocut printing of the full imagery. Book T gives the Keys their meanings only, no picture. Drawn from the Key&#x27;s title and the figure the tradition gives it, as a symbol (no faces): a winged figure pouring from one vessel into the other, one foot on land and one in the water; Sagittarius. Book T (1912): &quot;Combination of forces, realization, action (material effect, good or evil).&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); printed by scripts/build_book_t_linocut.py.</desc>
