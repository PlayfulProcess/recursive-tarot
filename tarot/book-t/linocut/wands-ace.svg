<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 960" width="560" height="960" role="img" aria-labelledby="t d">
<title id="t">Root of the Powers of Fire: Ace of Wands · the Root · Kether (Book T deck, linocut)</title>
<desc id="d">A linocut printing of the full imagery. Book T places the twenty-two Yods ambiguously (&#x27;and between it and that of the Right twelve: six above and six below about the Left-hand branch&#x27;): drawn as three below the right branch, seven above the centre, twelve about the left branch. The branches&#x27; &#x27;colours ... of the scales&#x27; are shown as a red, a blue and a yellow collar, each with a small sigil mark. Book T (1912): &quot;A WHITE Radiating Angelic Hand, issuing from clouds, and grasping a heavy club, which has three branches in the colours, and with the sigils, of the scales. The Right-and Left-hand branches end respectively in three Flames, and the Centre one in four Flames: thus yielding Ten: the Number of the Sephiroth. Two-and-twenty leaping Flames, or Yodh, surround it, answering to the Paths; of these, three fall below the Right branch for Aleph, Men, and Shin, seven above the Central branch for the double letters; and between it and that of the Right twelve: six above and six below about the Left-hand branch. The whole is a great and flaming Torch.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); printed by scripts/build_book_t_linocut.py.</desc>
