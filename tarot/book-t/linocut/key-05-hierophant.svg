<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 960" width="560" height="960" role="img" aria-labelledby="t d">
<title id="t">Magus of the Eternal: The Hierophant · Vau · Taurus (Book T deck, linocut)</title>
<desc id="d">A linocut printing of the full imagery. Book T gives the Keys their meanings only, no picture. Drawn from the Key&#x27;s title and the figure the tradition gives it, as a symbol (no faces): the Hierophant enthroned between two pillars, crowned, holding the staff of the triple cross, bulls&#x27; heads at his throne; Taurus. Book T (1912): &quot;Divine wisdom, manifestation, explanation, teaching, occult force voluntarily invoked.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); printed by scripts/build_book_t_linocut.py.</desc>
