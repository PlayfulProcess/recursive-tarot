<title id="t">Lord of Dominion: Two of Wands · Mars in Aries · Chokmah (Book T deck, linocut)</title>
<desc id="d">A linocut printing of the full imagery. Book T (1912): &quot;A WHITE Radiating Angelic hand, issuing from clouds, and grasping two crossed wands. Flames issue from the point of junction. On two small wands above and below, with flames of five issuing therefrom, are the symbols of Mars and Aries for the Decan.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); printed by scripts/build_book_t_linocut.py.</desc>
