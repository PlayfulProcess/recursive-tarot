<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 960" width="560" height="960" role="img" aria-labelledby="t d">
<title id="t">Priestess of the Silver Star: The High Priestess · Gimel · Moon (Book T deck, linocut)</title>
<desc id="d">A linocut printing of the full imagery. Book T gives the Keys their meanings only, no picture. Drawn from the Key&#x27;s title and the figure the tradition gives it, as a symbol (no faces): the Priestess enthroned between the black and the white pillars, the crescent on her head and the silver star above; the Moon. Book T (1912): &quot;Change, alternation, increase and decrease, fluctuation; whether for good or evil depends on the dignity.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); printed by scripts/build_book_t_linocut.py.</desc>
