<title id="t">Lord of Rest from Strife: Four of Swords · Jupiter in Libra · Chesed (Book T deck, linocut)</title>
<desc id="d">A linocut printing of the full imagery. Book T (1912): &quot;TWO White Radiating Angelic Hands, each holding two swords; which four cross in the centre. The rose of five petals with white radiations is reinstated on the point of their intersection. Above and below, on the points of two small daggers, are Jupiter and Libra, representing the Decanate.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); printed by scripts/build_book_t_linocut.py.</desc>
