<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 960" width="560" height="960" role="img" aria-labelledby="t d">
<title id="t">Lord of Abundance: Three of Cups · Mercury in Cancer · Binah (Book T deck, linocut)</title>
<desc id="d">A linocut printing of the full imagery. Book T (1912): &quot;A WHITE Radiating Hand, as before, holds a group of lotuses or water-lilies, from which two flowers rise on either side of, and overhanging the top cup; pouring into it the white water. Flowers in the same way pour white water into the lower cups. All the cups overflow; the topmost into the two others, and these upon the lower part of the card. Cups are arranged in an erect equilateral triangle. Mercury and Cancer above and below.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); printed by scripts/build_book_t_linocut.py.</desc>
