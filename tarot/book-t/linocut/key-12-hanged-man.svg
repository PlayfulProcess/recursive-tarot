<title id="t">Spirit of the Mighty Waters: The Hanged Man · Mem · Water (Book T deck, linocut)</title>
<desc id="d">A linocut printing of the full imagery. Book T gives the Keys their meanings only, no picture. Drawn from the Key&#x27;s title and the figure the tradition gives it, as a symbol (no faces): a figure hanging head downward from a gallows shaped like a Tau, over the Mighty Waters; Water. Book T (1912): &quot;Enforced sacrifice, punishment, loss, fatal and not voluntary, suffering.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); printed by scripts/build_book_t_linocut.py.</desc>
