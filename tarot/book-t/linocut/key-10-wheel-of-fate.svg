<title id="t">Lord of the Forces of Life: The Wheel of Fate · Kaph · Jupiter (Book T deck, linocut)</title>
<desc id="d">A linocut printing of the full imagery. Book T gives the Keys their meanings only, no picture. Drawn from the Key&#x27;s title and the figure the tradition gives it, as a symbol (no faces): the wheel of eight spokes turning among clouds; Jupiter. Book T (1912): &quot;Good fortune, happiness (within bounds). Intoxication of success.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); printed by scripts/build_book_t_linocut.py.</desc>
