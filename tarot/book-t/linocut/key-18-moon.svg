<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 960" width="560" height="960" role="img" aria-labelledby="t d">
<title id="t">Ruler of Flux and Reflux: the Child of the Sons of the Mighty: The Moon · Qoph · Pisces (Book T deck, linocut)</title>
<desc id="d">A linocut printing of the full imagery. Book T gives the Keys their meanings only, no picture. Drawn from the Key&#x27;s title and the figure the tradition gives it, as a symbol (no faces): the moon shedding drops, two towers and two dogs by the path, and the crayfish rising from the pool; Pisces. Book T (1912): &quot;Dissatisfaction, voluntary change. Error, lying, falsity, deception. This card is very sensitive to dignity.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); printed by scripts/build_book_t_linocut.py.</desc>
