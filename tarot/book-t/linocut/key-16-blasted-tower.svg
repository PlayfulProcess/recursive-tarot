<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 960" width="560" height="960" role="img" aria-labelledby="t d">
<title id="t">Lord of the Hosts of the Mighty: The Blasted Tower · Peh · Mars (Book T deck, linocut)</title>
<desc id="d">A linocut printing of the full imagery. Book T gives the Keys their meanings only, no picture. Drawn from the Key&#x27;s title and the figure the tradition gives it, as a symbol (no faces): the tower struck by the lightning flash, its crown falling, fire at its windows, two figures falling; Mars. Book T (1912): &quot;Ambition, fighting, war, courage, or destruction, danger, fall, ruin.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); printed by scripts/build_book_t_linocut.py.</desc>
