<title id="t">Lord of Victory: Six of Wands · Jupiter in Leo · Tiphareth (Book T deck, linocut)</title>
<desc id="d">A linocut printing of the full imagery. Book T (1912): &quot;TWO hands in grip as the last, holding six wands crossed three and three. Flames issue from the point of junction. Above and below are short wands with flames issuing, surmounted respectively by the symbols of Jupiter and Leo, representing the Decan.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); printed by scripts/build_book_t_linocut.py.</desc>
