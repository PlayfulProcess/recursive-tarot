<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 960" width="560" height="960" role="img" aria-labelledby="t d">
<title id="t">Lord of the Flame and Lightning: the King of the Spirits of Fire: Knight of Wands · Fire of Fire (Book T deck, full imagery)</title>
<desc id="d">The club &#x27;with flaming ends&#x27; is drawn as the deck&#x27;s wand with a flame at each end. Book T sets the winged black horse&#x27;s head above the helmet, on the cuirass, shoulder-pieces and buskins: drawn above the helmet and on the cuirass. Book T (1912): &quot;Note that the Kings are now called Knights, and the Princes are now called Kings. This is unfortunate, and leads to confusion; the Princes may be called Emperors without harm. Remember only that the horsed figures refer to the Yod of Tetragrammaton, the charioted figures to the Vau. A WINGED Warrior riding upon a black horse with flaming mane and tail: the horse itself is not winged. The rider wears a winged helmet (like the old Scandinavian and Gaulish helmet) with a Rayed Crown, a corslet of scale-mail and buskins of the same, and a flowing scarlet mantle. Above his helmet, upon his curass, and on the shoulder-pieces and buskins, he wears as a crest a winged black horse&#x27;s head. He grasps a club with flaming ends, somewhat similar to that in the symbol of the Ace of Wands, but not so heavy, and also the sigil of his scale is shown; beneath the rushing feet of his steed are waving flames and fire.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); composed by scripts/build_book_t_full_imagery.py.</desc>
