<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 960" width="560" height="960" role="img" aria-labelledby="t d">
<title id="t">Princess of the Shining Flame: the Rose of the Palace of Fire: Knave of Wands · Earth of Fire (Book T deck, full imagery)</title>
<desc id="d">Book T&#x27;s belt with &#x27;a winged tiger&#x27;s head in front&#x27; is drawn as the winged tiger&#x27;s head at her waist; the altar&#x27;s ram&#x27;s heads as two curled horns. Book T (1912): &quot;A VERY strong and beautiful woman with flowing red-gold hair, attired like an Amazon. Her shoulders, arms, bosom and knees are bare. She wears a short kilt reaching to the knee. Round her waist is a broad belt of scale-mail; narrow at the sides; broader in front and back; and having a winged tiger&#x27;s head in front. She wears a Corinthian-shaped helmet and crown with a long plume. It also is surmounted by a tiger&#x27;s head, and the same symbol forms the buckle of her scale-mail buskins. A mantle lined with tiger&#x27;s skin falls back from her shoulders. Her right hand rests on a small golden or brazen altar ornamented with ram&#x27;s heads and with Flames of Fire leaping from it. Her left hand leans on a long and heavy club, swelling at the lower end, where the sigil is placed; and it has flames of fire leaping from it the whole way down; but the flames are ascending. This club or torch is much longer than that carried by the King or Queen. Beneath her firmly placed feet are leaping Flames of Fire.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); composed by scripts/build_book_t_full_imagery.py.</desc>
