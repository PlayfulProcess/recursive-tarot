<title id="t">Queen of the Thrones of Air: Queen of Swords · Water of Air (Book T deck, full imagery)</title>
<desc id="d">The severed head is drawn as a symbol, bearded, without a face. Book T (1912): &quot;A GRACEFUL woman with wavy, curling hair, like a Queen seated upon a Throne and crowned. Beneath the Throne are grey cumulus clouds. Her general attire is as that of the Queen of Wands, but she wears as a crest a winged child&#x27;s head. A drawn sword in one hand, and in the other a large, bearded, newly severed head of a man.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); composed by scripts/build_book_t_full_imagery.py.</desc>
