<title id="t">Princess of the Waters: the Lotus of the Palace of the Floods: Knave of Cups · Earth of Water (Book T deck, full imagery)</title>
<desc id="d">&#x27;Away to her right a Dolphin&#x27;: her right, the viewer&#x27;s left. Her crest is drawn as the swan with opening wings. Book T (1912): &quot;A BEAUTIFUL Amazon-like figure, softer in nature than the Princess of Wands. Her attire is similar. She stands on a sea with foaming spray. Away to her right a Dolphin. She wears as a crest a swan with opening wings. She bears in one hand a lotus, and in the other an open cup from which a turtle issues. Her mantle is lined with swansdown, and is of thin floating material.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); composed by scripts/build_book_t_full_imagery.py.</desc>
