<desc id="d">Book T: &#x27;The pose of the other sword symbols is re-established in the centre.&#x27; Read as the rose of the earlier sword cards, set in the centre. Book T (1912): &quot;FOUR White Radiant Angelic Hands issuing from clouds, each holding two swords, points upwards; all the points touch near the top of the card. Hands issue, two at each bottom angle of the card. The pose of the other sword symbols is re-established in the centre. Above and below are the Decan symbols Jupiter and Gemini.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); composed by scripts/build_book_t_full_imagery.py.</desc>
