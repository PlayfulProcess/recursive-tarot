<title id="t">Lord of Strife: Five of Wands · Saturn in Leo · Geburah (Book T deck, full imagery)</title>
<desc id="d">Drawn as Book T (1912) describes it: &quot;TWO White Radiant Angelic Hands issuant per nubes dexter and sinister. They are clasped together in the grip of the First Order ... and they hold, at the same time, by their centres, five wands or torches ... One wand is upright in the middle; the others cross each other. Flames leap from the point of junction. Above the middle wand is the sign Saturn, and below is that of Leo&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); composed by scripts/build_book_t_full_imagery.py.</desc>
