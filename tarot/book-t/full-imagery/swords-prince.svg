<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 960" width="560" height="960" role="img" aria-labelledby="t d">
<title id="t">Prince of the Chariot of the Winds: King of Swords · Air of Air (Book T deck, full imagery)</title>
<desc id="d">The Arch Fays are drawn as two small winged youths with butterfly wings, a pentagram on the brow and a wand surmounted by a pentagram; no faces. Book T (1912): &quot;A WINGED King with Winged Crown, seated in a chariot drawn by Arch Fays, represented as winged youths very slightly dressed, with butterfly wings: heads encircled by a fillet with a pentagram thereon: and holding wands surmounted by pentagrams, the same butterfly wings on their feet and fillets. General equipment as the King of Wands: but he bears as a crest a winged angelic head with a pentagram on the brows. Beneath the chariot are grey nimbus clouds. His hair long and waving in serpentine whirls, and whorl figures compose the scales of his armour. A drawn sword in one hand; a sickle in the other. With the sword he rules, with the sickle he slays.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); composed by scripts/build_book_t_full_imagery.py.</desc>
