<title id="t">Princess of the Echoing Hills: the Rose of the Palace of Earth: Knave of Pentacles · Earth of Earth (Book T deck, full imagery)</title>
<desc id="d">&#x27;Standing on grass or flowers&#x27;: drawn as land with flowers; her mantle of sheepskin in cream. Book T (1912): &quot;A STRONG and beautiful Amazon figure with rich brown hair, standing on grass or flowers. A grove of trees near her. Her form suggests Hebe, Ceres, and Proserpine. She bears a winged ram&#x27;s head as a crest: and wears a mantle of sheepskin. In one hand she carries a sceptre with a circular disk: in the other a Pentacle similar to that of the Ace of Pentacles.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); composed by scripts/build_book_t_full_imagery.py.</desc>
