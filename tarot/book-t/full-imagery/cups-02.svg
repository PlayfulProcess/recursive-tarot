<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 960" width="560" height="960" role="img" aria-labelledby="t d">
<title id="t">Lord of Love: Two of Cups · Venus in Cancer · Chokmah (Book T deck, full imagery)</title>
<desc id="d">Drawn as Book T (1912) describes it: &quot;A WHITE Radiant Hand, issuant from the lower part of the card from a cloud, holds lotuses. A lotus flower rises above water, which occupies the lower part of the card rising above the hand. From this flower rises a stem, terminating near the top of the card in another lotus, from which flows a sparkling white water, as from a fountain. Crossed on the stem just beneath are two dolphins, Argent and Or, on to which the water falls, and from which it pours in full streams, like jets of gold and silver, into two cups; which in their turn overflow, flooding the lower part of the card. Venus and Cancer above and below.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); composed by scripts/build_book_t_full_imagery.py.</desc>
