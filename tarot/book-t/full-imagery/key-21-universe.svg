<title id="t">Great One of the Night of Time: The Universe · Tau · Earth and Saturn (Book T deck, full imagery)</title>
<desc id="d">Book T gives the Keys their meanings only, no picture. Drawn from the Key&#x27;s title and the figure the tradition gives it, as a symbol (no faces): a figure within the elliptical wreath, and the four Kerubim at the corners (man, eagle, bull, lion); Earth and Saturn. Book T (1912): &quot;The matter itself. Synthesis, world, kingdom. Usually denotes actual subject of question, and therefore depends entirely on accompanying cards.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); composed by scripts/build_book_t_full_imagery.py.</desc>
