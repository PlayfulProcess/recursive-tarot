<title id="t">Root of the Powers of Air: Ace of Swords · the Root · Kether (Book T deck, full imagery)</title>
<desc id="d">Book T hangs the olive branch &#x27;on the right&#x27; and the palm &#x27;on the left&#x27; without saying whose right: drawn on the viewer&#x27;s right and left. The Vaus fall from the point, here on either side of the blade below the crown. Book T (1912): &quot;A WHITE Radiating Angelic Hand, issuing from clouds, and grasping the hilt of a sword, which supports a White Radiant Celestial Crown; from which depend, on the right, the olive branch of Peace; and on the left, the palm branch of suffering. Six Vaus fall from its point.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); composed by scripts/build_book_t_full_imagery.py.</desc>
