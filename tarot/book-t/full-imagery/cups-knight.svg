<title id="t">Lord of the Waves and the Waters: the King of the Hosts of the Sea: Knight of Cups · Fire of Water (Book T deck, full imagery)</title>
<desc id="d">Book T gives no colour for his mantle: drawn blue, the colour of Water. Book T (1912): &quot;A BEAUTIFUL, winged, youthful Warrior with flying hair, riding upon a white horse, which latter is not winged. His general equipment is similar to that of the Knight of Wands, but upon his helmet, cuirass and buskins is a peacock with opened wings. He holds a cup in his hand, bearing the sigil of the scale. Beneath his horse&#x27;s feet is the sea. From the cup issues a crab.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); composed by scripts/build_book_t_full_imagery.py.</desc>
