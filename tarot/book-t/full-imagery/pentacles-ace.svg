<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 960" width="560" height="960" role="img" aria-labelledby="t d">
<title id="t">Root of the Powers of Earth: Ace of Pentacles · the Root · Kether (Book T deck, full imagery)</title>
<desc id="d">Book T: &#x27;Four Crosses and two buds are shewn.&#x27; Read as four roses and two buds on the rose branch (the Maltese cross is already above the pentacle). Book T (1912): &quot;A WHITE Radiant Angelic Hand, holding a branch of a Rose Tree, whereon is a large Pentacle, formed of Five concentric circles. The Innermost Circle is white, charged with a red Greek Cross. From this White Centre, Twelve Rays, also white, issue: these terminate at the circumference, making the whole something like an Astrological figure of the Heavens. It is surmounted by a small circle, above which is a large white Maltese Cross, and with two white wings. Four Crosses and two buds are shewn. The Hand issueth from the Clouds as in the other three cases.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); composed by scripts/build_book_t_full_imagery.py.</desc>
