<title id="t">Lord of Abandoned Success: Eight of Cups · Saturn in Pisces · Hod (Book T deck, full imagery)</title>
<desc id="d">Drawn as Book T (1912) describes it: &quot;A WHITE Radiating Angelic Hand, holding a group of stems of lotuses or water-lilies. There are only two flowers shown, which bend over the two central cups, pouring into them a white water which fills them and runs over into the three lowest, which later are not yet filled The three uppermost are quite empty. At the top and bottom of the card are symbols Saturn and Pisces.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); composed by scripts/build_book_t_full_imagery.py.</desc>
