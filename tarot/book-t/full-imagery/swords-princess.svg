<title id="t">Princess of the Rushing Winds: the Lotus of the Palace of Air: Knave of Swords · Earth of Air (Book T deck, full imagery)</title>
<desc id="d">Her mantle &#x27;resembles the AEgis of Minerva&#x27;: drawn as a grey mantle. Book T (1912): &quot;AN AMAZON figure with waving hair, slighter than the Rose of the Palace of Fire. Her attire is similar. The Feet seem springy, giving the idea of swiftness. Weight changing from one foot to another and body swinging around. She is a mixture of Minerva and Diana: her mantle resembles the AEgis of Minerva. She wears as a crest the head of the Medusa with serpent hair. She holds a sword in one hand; and the other rests upon a small silver altar with grey smoke (no fire) ascending from it. Beneath her feet are white clouds.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); composed by scripts/build_book_t_full_imagery.py.</desc>
