<title id="t">Lord of Loss in Pleasure: Five of Cups · Mars in Scorpio · Geburah (Book T deck, full imagery)</title>
<desc id="d">Drawn as Book T (1912) describes it: &quot;A WHITE Radiating Angelic Hand, holding lotuses or water-lilies, of which the flowers are falling right and left. Leaves only, and no buds, surmount them. These lotus stems ascend between the cups in the manner of a fountain, but no water flows therefrom; neither is there water in any of the cups, which are somewhat of the shape of the magical instrument of the Zelator Adeptus Minor. Above and below are the symbols of Mars and Scorpio for the Decan.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); composed by scripts/build_book_t_full_imagery.py.</desc>
