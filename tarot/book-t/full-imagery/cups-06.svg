<title id="t">Lord of Pleasure: Six of Cups · Sun in Scorpio · Tiphareth (Book T deck, full imagery)</title>
<desc id="d">Drawn as Book T (1912) describes it: &quot;AN Angelic Hand, as before, holds a group of stems of water-lilies or lotuses, from which six flowers bend, one over each cup. From these flowers a white glistening water flows into the cups as from a fountain, but they are not yet full. Above and below are Sun and Scorpio referring to the Decan.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); composed by scripts/build_book_t_full_imagery.py.</desc>
