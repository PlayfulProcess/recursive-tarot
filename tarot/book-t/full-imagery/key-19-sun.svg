<desc id="d">Book T gives the Keys their meanings only, no picture. Drawn from the Key&#x27;s title and the figure the tradition gives it, as a symbol (no faces): the sun in his glory over two children before a wall; the Sun. Book T (1912): &quot;Glory, gain, riches. With &quot;very&quot; evil cards it means arrogance, display, vanity.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); composed by scripts/build_book_t_full_imagery.py.</desc>
