<title id="t">Queen of the Thrones of Earth: Queen of Pentacles · Water of Earth (Book T deck, full imagery)</title>
<desc id="d">&#x27;Her symbolism is best represented in profile&#x27;: her head is drawn half light, half dark, without a face. Book T (1912): &quot;A WOMAN of beautiful face with dark hair; seated upon a throne, beneath which is dark sandy earth. One side of her face is light, the other dark; and her symbolism is best represented in profile. Her attire is similar to that of the Queen of Wands: but she bears a winged goat&#x27;s head as a crest. A goat is by her side. In one hand she bears a sceptre surmounted by a cube, and in the other an orb of gold.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); composed by scripts/build_book_t_full_imagery.py.</desc>
