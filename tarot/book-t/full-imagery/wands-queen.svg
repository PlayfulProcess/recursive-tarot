<title id="t">Queen of the Thrones of Flame: Queen of Wands · Water of Fire (Book T deck, full imagery)</title>
<desc id="d">Drawn as Book T (1912) describes it: &quot;A CROWNED queen with long red-golden hair, seated upon a Throne, with steady flames beneath. She wears a corslet and buskins of scale-mail, which latter her robe discloses. Her arms are almost bare. On cuirass and buskins are leopard&#x27;s heads winged, and the same symbol surmounteth her crown. At her side is a couchant leopard on which her hands rest. She bears a long wand with a very heavy conical head.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); composed by scripts/build_book_t_full_imagery.py.</desc>
