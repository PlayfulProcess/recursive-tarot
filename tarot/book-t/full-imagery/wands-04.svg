<title id="t">Lord of Perfected Work: Four of Wands · Venus in Aries · Chesed (Book T deck, full imagery)</title>
<desc id="d">Drawn as Book T (1912) describes it: &quot;TWO White Radiating Angelic Hands, as before, issuing from clouds right and left of the card and clasped in the centre with the grip of the First Order, holding four wands or torches crossed. Flames issue from the point of junction. Above and below are two small flaming wands, with the symbols of Venus and Aries representing the Decan.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); composed by scripts/build_book_t_full_imagery.py.</desc>
