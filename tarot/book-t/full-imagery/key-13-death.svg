<title id="t">Child of the Great Transformers: the Lord of the Gates of Death: Death · Nun · Scorpio (Book T deck, full imagery)</title>
<desc id="d">Book T gives the Keys their meanings only, no picture. Drawn from the Key&#x27;s title and the figure the tradition gives it, as a symbol (no faces): a cloaked figure with the scythe, a fallen crown at its feet; Scorpio. Book T (1912): &quot;Time, age, transformation, change involuntary (as opposed to 18, Pisces). Or death, destruction (only latter with special cards). [Specially, a sudden and quite unexpected change.]&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); composed by scripts/build_book_t_full_imagery.py.</desc>
