<title id="t">Lord of the Wind and the Breezes: the King of the Spirits of Air: Knight of Swords · Fire of Air (Book T deck, full imagery)</title>
<desc id="d">Book T gives no colour for his mantle: drawn in the yellow of Air. Book T (1912): &quot;A WINGED Warrior with crowned Winged Helmet, mounted upon a brown steed. His general equipment is as that of the Knight of Wands, but he wears as a crest a winged six-pointed star, similar to those represented on the heads of Castor and Pollux the Dioscuri, the twins Gemini (a part of which constellation is included in his rule). He holds a drawn sword with the sigil of his scale upon its pommel. Beneath his horse&#x27;s feet are dark-driving stratus clouds.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); composed by scripts/build_book_t_full_imagery.py.</desc>
