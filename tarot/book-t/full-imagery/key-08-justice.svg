<title id="t">Daughter of the Lords of Truth: the Ruler of the Balance: Justice · Lamed · Libra (Book T deck, full imagery)</title>
<desc id="d">Book T gives the Keys their meanings only, no picture. Drawn from the Key&#x27;s title and the figure the tradition gives it, as a symbol (no faces): Justice enthroned between two pillars, the sword upright in one hand, the balances in the other; Libra. Book T (1912): &quot;Eternal justice. Strength and force, but arrested as in act of judgment. May mean law, trial, etc.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); composed by scripts/build_book_t_full_imagery.py.</desc>
