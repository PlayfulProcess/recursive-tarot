<title id="t">Daughter of the Mighty Ones: The Empress · Daleth · Venus (Book T deck, full imagery)</title>
<desc id="d">Book T gives the Keys their meanings only, no picture. Drawn from the Key&#x27;s title and the figure the tradition gives it, as a symbol (no faces): the Empress enthroned and crowned with stars, holding a sceptre, her shield of Venus beside her, ripe wheat at her feet. Book T (1912): &quot;Beauty, happiness, pleasure, success. But with very bad dignity it means luxury, dissipation.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); composed by scripts/build_book_t_full_imagery.py.</desc>
