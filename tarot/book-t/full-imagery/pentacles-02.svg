<title id="t">Lord of Harmonious Change: Two of Pentacles · Jupiter in Capricorn · Chokmah (Book T deck, full imagery)</title>
<desc id="d">Drawn as Book T (1912) describes it: &quot;TWO wheels, disks or pentacles, similar to that of the Ace. They are united by a green-and-gold serpent, bound about them like a figure of 8. It holds its tail in its mouth. A White Radiant Angelic Hand holds the centre of the whole. No roses enter into this card. Above and below are the symbols of Jupiter and Capricorn. It is a revolving symbol.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); composed by scripts/build_book_t_full_imagery.py.</desc>
