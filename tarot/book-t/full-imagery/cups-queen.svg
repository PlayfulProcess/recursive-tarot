<title id="t">Queen of the Thrones of the Waters: Queen of Cups · Water of Water (Book T deck, full imagery)</title>
<desc id="d">The crest &#x27;Ibis with opened wings&#x27; is drawn small over a pair of crest wings. Book T (1912): &quot;A VERY beautiful fair woman like a crowned Queen, seated upon a throne, beneath which is flowing water wherein Lotuses are seen. Her general dress is similar to that of the Queen of Wands, but upon her crown, cuirass and buskins is seen an Ibis with opened wings, and beside her is the same bird, whereon her hand rests. She holds a cup, wherefrom a crayfish issues. Her face is dreamy. She holds a lotus in the hand upon the Ibis.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); composed by scripts/build_book_t_full_imagery.py.</desc>
