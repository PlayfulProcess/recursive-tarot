<title id="t">Lord of Illusionary Success: Seven of Cups · Venus in Scorpio · Netzach (Book T deck, full imagery)</title>
<desc id="d">Drawn as Book T (1912) describes it: &quot;THE seven cups are arranged as two descending triangles above a point: a hand, as usual, holds lotus stems which arise from the central lower cup. The hand is above this cup and below the middle one. With the exception of the central lower cup, each is overhung by a lotus flower, but no water falls from these into any of the cups, which are all quite empty. Above and below are the symbols of the Decanate Venus and Scorpio.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); composed by scripts/build_book_t_full_imagery.py.</desc>
