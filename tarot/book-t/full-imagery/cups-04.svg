<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 960" width="560" height="960" role="img" aria-labelledby="t d">
<title id="t">Lord of Blended Pleasure: Four of Cups · Moon in Cancer · Chesed (Book T deck, full imagery)</title>
<desc id="d">Drawn as Book T (1912) describes it: &quot;FOUR cups: the two upper overflowing into the two lower, which do not overflow. An Angelic Hand grasps a branch of lotus, from which ascends a stem bearing one flower at the top of the card, from which the white water flows into the two upper cups. From the centre two leaves pass right and left, making, as it were, a cross between the four cups. Above and below are the symbols Moon and Cancer for the Decan.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); composed by scripts/build_book_t_full_imagery.py.</desc>
