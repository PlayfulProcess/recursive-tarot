<title id="t">Prince of the Chariot of Fire: King of Wands · Air of Fire (Book T deck, full imagery)</title>
<desc id="d">His torch or fire-wand is drawn as the deck&#x27;s flaming wand. Book T (1912): &quot;A KINGLY Figure with a golden, winged crown, seated on a chariot. He has large white wings. One wheel of his chariot is shewn. He wears corslet and buskins of scale armour decorated with a winged lion&#x27;s head, which symbol also surmounts his crown. His chariot is drawn by a lion. His arms are bare, save for the shoulder-pieces of the corslet, and he bears a torch or fire-wand, somewhat similar to that of the Zelator Adeptus Minor. Beneath the chariot are flames, some waved, some salient.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); composed by scripts/build_book_t_full_imagery.py.</desc>
