<title id="t">Prince of the Chariot of Earth: King of Pentacles · Air of Earth (Book T deck, full imagery)</title>
<desc id="d">The orb &#x27;held downwards&#x27; hangs below his hand. Book T (1912): &quot;A WINGED Kingly Figure seated in a chariot drawn by a bull. He bears as a crest the symbol of the head of the winged bull. Beneath the chariot is land, with many flowers. In the one hand he bears an orb of gold held downwards, and in the other a sceptre surmounted by an orb and cross.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); composed by scripts/build_book_t_full_imagery.py.</desc>
