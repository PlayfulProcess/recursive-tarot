<title id="t">Root of the Powers of Water: Ace of Cups · the Root · Kether (Book T deck, full imagery)</title>
<desc id="d">Drawn as Book T (1912) describes it: &quot;A WHITE Radiant Angelic Hand, issuing from clouds, and supporting on the palm thereof a cup, resembling that of the Stolistes. From it rises a fountain of clear and glistening water: and sprays falling on all sides into clear calm water below, in which grow Lotuses and Water-lilies. The great Letter of the Supernal Mother is traced in the spray of the Fountain.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); composed by scripts/build_book_t_full_imagery.py.</desc>
