<title id="t">Daughter of the Firmament, the dweller between the Waters: The Star · Tzaddi · Aquarius (Book T deck, full imagery)</title>
<desc id="d">Book T gives the Keys their meanings only, no picture. Drawn from the Key&#x27;s title and the figure the tradition gives it, as a symbol (no faces): the great star of eight points and seven lesser stars; a figure pours water from two vessels, onto the land and into the pool; Aquarius. Book T (1912): &quot;Hope, faith, unexpected help. Or dreaminess, deceived hope, etc.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); composed by scripts/build_book_t_full_imagery.py.</desc>
