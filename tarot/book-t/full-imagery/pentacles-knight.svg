<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 960" width="560" height="960" role="img" aria-labelledby="t d">
<title id="t">Lord of the Wide and Fertile Land: the King of the Spirits of Earth: Knight of Pentacles · Fire of Earth (Book T deck, full imagery)</title>
<desc id="d">Book T gives no colour for his mantle: drawn green, the colour of Earth. The pentacle, in his other hand, is shewn at his side. Book T (1912): &quot;A DARK Winged Warrior with winged and crowned helmet: mounted on a light brown horse. Equipment as the Knight of Wands. The winged head of a stag or antelope as a crest. Beneath the horse&#x27;s feet is fertile land with ripened corn. In one hand he bears a sceptre surmounted by a hexagram: in the other a Pentacle like that of the Zelator Adeptus Minor.&quot; Parts drawn for recursive-tarot (CC BY-SA 4.0); composed by scripts/build_book_t_full_imagery.py.</desc>
