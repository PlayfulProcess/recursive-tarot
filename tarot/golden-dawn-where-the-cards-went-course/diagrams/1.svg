<svg width="360" height="560" class="gdw" viewBox="0 0 360 560" role="img" aria-label="Timeline from Book T to the printed Golden Dawn decks" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="360" height="560" fill="#ffffff"/><style>.gdw-fig{margin:1.6rem auto;max-width:520px}.gdw-fig svg{display:block;width:100%;height:auto}.gdw-fig figcaption{font-size:.85rem;color:#6b6457;margin-top:.5rem;line-height:1.45} .gdw text{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#221f1a;font-size:11.5px}.gdw .yr{fill:#9a7322;font-weight:700;font-size:11px}.gdw .mut{fill:#6b6457;font-size:10.5px}.gdw .spine{stroke:#9a7322;stroke-width:2}.gdw .dot{fill:#ffffff;stroke:#9a7322;stroke-width:2}.gdw .lost{fill:#ffffff;stroke:#8a8273;stroke-width:2;stroke-dasharray:3 3}.gdw .fire{fill:none;stroke:#c0473b;stroke-width:2;stroke-linejoin:round}.gdw .band{fill:#faf8f3}</style><title>From Book T to the printed decks</title><rect class="band" x="0" y="8" width="360" height="190" rx="8"/><text x="14" y="26" class="mut">BY HAND, INSIDE THE ORDER</text><rect class="band" x="0" y="214" width="360" height="338" rx="8"/><text x="14" y="232" class="mut">IN PRINT, FOR ANYONE</text><line class="spine" x1="96" y1="40" x2="96" y2="540"/><circle class="dot" cx="96" cy="50" r="6"/><text x="86" y="54" class="yr" text-anchor="end">c.1890</text><text x="110" y="54">Book T, a text; pattern deck</text><circle class="lost" cx="96" cy="78" r="6"/><text x="86" y="82" class="yr" text-anchor="end">1890s</text><text x="110" y="82">members copy cards (lost)</text><circle class="dot" cx="96" cy="106" r="6"/><text x="86" y="110" class="yr" text-anchor="end">1912</text><text x="110" y="110">Whare Ra opens, New Zealand</text><circle class="lost" cx="96" cy="134" r="6"/><text x="86" y="138" class="yr" text-anchor="end">1930s</text><text x="110" y="138">Regardie paints his own deck</text><circle class="lost" cx="96" cy="162" r="6"/><text x="86" y="166" class="yr" text-anchor="end">1960s</text><text x="110" y="166">his cards lost; Whare Ra takes BOTA</text><path class="fire" d="M96,196 c-8,-8 -4,-14 0,-20 c4,6 8,12 0,20 z"/><text x="86" y="190" class="yr" text-anchor="end">1978</text><text x="110" y="190">Whare Ra closes; papers burned</text><circle class="dot" cx="96" cy="250" r="6"/><text x="86" y="254" class="yr" text-anchor="end">1909</text><text x="110" y="254">Rider-Waite-Smith</text><circle class="dot" cx="96" cy="278" r="6"/><text x="86" y="282" class="yr" text-anchor="end">1912</text><text x="110" y="282">Book T printed in The Equinox</text><circle class="dot" cx="96" cy="306" r="6"/><text x="86" y="310" class="yr" text-anchor="end">1938–40</text><text x="110" y="310">Regardie prints the papers</text><circle class="dot" cx="96" cy="334" r="6"/><text x="86" y="338" class="yr" text-anchor="end">1938–43</text><text x="110" y="338">Thoth painted (printed 1968)</text><circle class="dot" cx="96" cy="362" r="6"/><text x="86" y="366" class="yr" text-anchor="end">1977–78</text><text x="110" y="366">Wang, from Regardie's photos</text><circle class="dot" cx="96" cy="390" r="6"/><text x="86" y="394" class="yr" text-anchor="end">1979–80</text><text x="110" y="394">Dowson, Hermetic Tarot</text><circle class="dot" cx="96" cy="418" r="6"/><text x="86" y="422" class="yr" text-anchor="end">1991</text><text x="110" y="422">the Ciceros</text><circle class="dot" cx="96" cy="446" r="6"/><text x="86" y="450" class="yr" text-anchor="end">2008</text><text x="110" y="450">Whare Ra cards redrawn, in a book</text><circle class="dot" cx="96" cy="474" r="6"/><text x="86" y="478" class="yr" text-anchor="end">2022</text><text x="110" y="478">…and coloured, as a deck</text><text x="110" y="512" class="mut">open circle: lost or never printed</text><text x="110" y="528" class="mut">flame: the 1978 fire</text></svg>